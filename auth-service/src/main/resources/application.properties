server.port=0
spring.application.name=auth-service
eureka.instance.preferIpAddress=true
eureka.client.serviceUrl.defaultZone=http://localhost:8070/eureka
spring.cloud.compatibility-verifier.enabled=false
spring.cloud.config.uri=http://localhost:8071
spring.config.import=configserver:
logging.level.org.springframework.web=warn
logging.level.com.example=debug
security.key=MAUPOVKA_TEST


spring.kafka.consumer.group-id=auth
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.example.authservice.kafka.UserDtoDeserializer

resilience4j.circuitbreaker.instances.getUserByEmail.register-health-indicator=true
resilience4j.circuitbreaker.instances.getUserByEmail.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.getUserByEmail.failure-rate-threshold=15
resilience4j.circuitbreaker.instances.getUserByEmail.record-exceptions[0]=java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.getUserByEmail.record-exceptions[1]=org.springframework.web.client.HttpServerErrorException

resilience4j.bulkhead.instances.bulkAuth.max-wait-duration=15ms
resilience4j.bulkhead.instances.bulkAuth.max-concurrent-calls=10


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Wallet</title>
    <link rel="stylesheet" href="/css/wallet.css">
</head>

<body>
<header>
    <nav>
        <ul>
            <li><a href="/main">Main</a></li>
        </ul>
    </nav>
    <div class="user-info">
        <span class="username">Username</span>
        <span id="ubalance" class="user-balance">0 BBC</span>
    </div>
</header>
<main>
    <h1>Wallet</h1>
    <div class="wallet-container">
        <div class="wallet-balance">
            <h2>Current balance</h2>
            <p id="cbalance" class="wallet-balance-amount">0 BBC</p>
        </div>
        <div class="wallet-deposit">
            <h2>Deposit</h2>
            <form class="deposit-form">
                <div class="form-group">
                    <label for="deposit-amount">Amount:</label>
                    <input type="number" id="deposit-amount" name="deposit-amount" step="1" required>
                    <span class="currency">USD</span>
                </div>
                <button type="submit">Deposit</button>
            </form>
        </div>
        <div class="wallet-withdraw">
            <h2>Withdraw</h2>
            <form class="withdraw-form">
                <div class="form-group">
                    <label for="withdraw-amount">Amount:</label>
                    <input type="number" id="withdraw-amount" name="withdraw-amount" step="1" required>
                    <span class="currency">USD</span>
                </div>
                <button type="submit">Withdraw</button>
            </form>
        </div>
    </div>
</main>
<footer>
    <p>&copy; Bykwarb slots</p>
</footer>
<script src="https://cdn.jsdelivr.net/sockjs/latest/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/wallet.js"></script>
</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Настройки пользователя</title>
    <link rel="stylesheet" href="/css/user.css">
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="/main">Slot</a></li>
        </ul>
    </nav>
</header>
<main>
    <h1>User data</h1>
    <form th:object="${userDto}" th:action="@{/change-userdata}" method="post">
        <div class="form-group">
            <label for="firstName">Username</label>
            <input type="text" id="firstName" name="firstName"  th:field="*{username}">
            <div class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" th:field="*{email}">
            <div class="error-message"></div>
        </div>
        <div class="form-actions">
            <button type="submit">Save</button>
        </div>
    </form>
    <h1>Change password</h1>
    <form class="password-form">
        <div class="form-group">
            <label for="oldPassword">Old password</label>
            <input type="password" id="oldPassword" name="oldPassword">
            <div class="error-message"></div>
        </div>
        <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" name="newPassword">
            <div class="error-message"></div>
        </div>
        <div class="form-actions">
            <button type="submit">Save</button>
        </div>
    </form>
</main>
<footer>
    <p>&copy; Bykwarb slots</p>
</footer>
<script src="/js/user.js"></script>
</body>
</html>
